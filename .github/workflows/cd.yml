name: CD # Continuous Deployment

on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+"

env:
  # The one [[bin]] target in the workspace today (crates/meethook/Cargo.toml, package
  # "meethook"). Every job below loops over this list rather than hard-coding the name, so a
  # future second `[[bin]]` only needs adding here.
  BINARIES: meethook

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Native `cargo build`, not `nix build`: this is the fast path to a release tarball, run
  # directly on the runner's own toolchain via the devShell rather than through a full Nix
  # package derivation. `nix-check` below builds the same binary the Nix way and validates it
  # separately; this job's tarballs are what actually get published.
  build:
    name: Build (${{ matrix.job.os-name }}-${{ matrix.job.architecture }})
    needs: ci
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - os: macos-26
            os-name: macos
            target: aarch64-apple-darwin
            architecture: arm64
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-gnu
            architecture: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        timeout-minutes: 15
        with:
          use-flakehub: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.job.os-name }}
          workspaces: ". -> target"

      - name: Install the Metal Toolchain
        if: runner.os == 'macOS'
        run: bash .github/scripts/ensure-metal-toolchain.sh
      - name: Evict stale native build caches
        run: nix develop -c bash .github/scripts/evict-stale-nix-store-refs.sh

      - name: Cargo build
        run: |
          set -euo pipefail
          for BIN in $BINARIES; do
            nix develop -c cargo build --release --target ${{ matrix.job.target }} --bin "$BIN"
          done

      - name: Packaging release artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.job.target }}/release
          for BIN in $BINARIES; do
            # Reduce binary size by removing debug symbols.
            strip "$BIN"

            if [ "${{ matrix.job.os-name }}" = macos ]; then
              # The release must be one file that runs on any Mac. ONNX Runtime is linked
              # statically (the dev shell has none to find, so ort-sys downloads its static
              # build; see MLX.md), and the MLX shaders are embedded. What is left is libiconv:
              # nix's Apple SDK has none, so its compiler wrapper links nix's copy, by absolute
              # /nix/store path. macOS ships the same library at /usr/lib/libiconv.2.dylib, so
              # point the binary there, re-sign (editing invalidates the signature, and arm64
              # will not run an unsigned or broken binary), then fail the release if anything
              # outside the system is still linked.
              for lib in $(otool -L "$BIN" | awk '/\/nix\/store\/.*libiconv/ {print $1}'); do
                install_name_tool -change "$lib" /usr/lib/libiconv.2.dylib "$BIN"
              done
              codesign --force --sign - "$BIN"
              if otool -L "$BIN" | awk 'NR > 1 {print $1}' | grep -v -e '^/System/Library/' -e '^/usr/lib/'; then
                echo "::error::$BIN links libraries outside the system (listed above); it would not run on a Mac without them"
                exit 1
              fi
            fi

            RELEASE_NAME="${BIN}-${GITHUB_REF_NAME}-${{ matrix.job.os-name }}-${{ matrix.job.architecture }}"
            tar czvf "$RELEASE_NAME.tar.gz" "$BIN"
            shasum -a 256 "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.job.os-name }}-${{ matrix.job.architecture }}
          path: |
            target/${{ matrix.job.target }}/release/*.tar.gz
            target/${{ matrix.job.target }}/release/*.sha256
          retention-days: 1

  nix-check:
    name: Nix build (${{ matrix.os }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        timeout-minutes: 15
        with:
          use-flakehub: false
      - uses: cachix/cachix-action@v15
        with:
          name: jeffutter
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      # On macOS `.#meethook` is the MLX package, which builds unsandboxed against the host's
      # Metal Toolchain (flake.nix, `__noChroot`); the runner image does not ship it.
      - name: Install the Metal Toolchain
        if: runner.os == 'macOS'
        run: bash .github/scripts/ensure-metal-toolchain.sh
      - run: nix build .#meethook --option log-lines 200
      - run: nix flake check

  release:
    name: Publish release
    needs: [build, nix-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Releasing assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            THIRD_PARTY_LICENSES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
