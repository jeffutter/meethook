[workspace]
resolver = "3"
members = [
  "crates/meethook",
  "crates/meethook-enroll",
  "crates/meethook-models",
  "crates/meethook-record",
  "crates/meethook-session",
  "crates/meethook-transcribe",
]

[workspace.package]
edition = "2024"
# 1.88 rather than 1.85 because `ropus` declares that floor, so a 1.85 toolchain can no longer
# build this workspace and saying otherwise would be a false claim rather than a conservative
# one. The devShell pins 1.97, so nothing observable changes here.
rust-version = "1.88"
publish = false

# A `cargo run` has to be usable on a real session, and at opt-level 0 it is not: the
# transcribe pre-pass is scalar float DSP over ~141 M samples per track -- rubato's
# resampler and the per-sample push loop in meethook-transcribe::audio, the GCC-PHAT
# correlator in ::align, the fbank extractor, the clustering -- which is the shape an
# unoptimized build punishes hardest. Unoptimized, the 49-minute session used to size this
# spent 4m24s before printing its first useful line; at opt-level 2 it spends 22s.
#
# `[profile.dev]` rather than a documented `--release` workflow, deliberately:
#
# - It covers dependencies as well as workspace members, so rubato and the realfft/rustfft
#   under GCC-PHAT are optimized alongside this workspace's own loops. (The mirror image,
#   `[profile.dev.package."*"]`, would reach only the dependencies -- and the hot code here
#   is ours.)
# - `debug-assertions` and `overflow-checks` stay on, so `subtract`'s `debug_assert_eq!` and
#   every other in-tree net keeps firing. `--release` silently drops both, which would mean
#   the build a developer runs is no longer the build the tests gate.
# - `cargo test` inherits from dev, so the 60-second AEC3 fixtures, the clustering and the
#   fbank tests speed up too. That is where the extra codegen time is paid back, since
#   `lefthook run pre-push` runs the whole workspace's tests.
[profile.dev]
opt-level = 2

[workspace.dependencies]
meethook-enroll = { path = "crates/meethook-enroll" }
meethook-models = { path = "crates/meethook-models" }
meethook-record = { path = "crates/meethook-record" }
meethook-session = { path = "crates/meethook-session" }
meethook-transcribe = { path = "crates/meethook-transcribe" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
hound = "3.5"
jiff = "0.2"
# Only for `proc_pidpath`, the one libproc call meethook-record needs to name the
# executable behind a capturing pid. Already in the tree transitively, so this adds no
# crate to the build graph.
libc = "0.2"
mach2 = "0.5"
# The template engine behind `transcript.md`. Templates are read from a path at runtime --
# `<root>/transcript.md.jinja`, or whatever `--template` names -- so a compile-time engine
# such as askama cannot express this at all.
#
# minijinja over tera, the other pure-Rust candidate, for three reasons. Its default feature
# set adds only `memo-map` to this tree (serde is already here), where tera's pulls
# `globset`, `walkdir`, `ahash` and `unicode-segmentation` to support a directory-glob
# loader that one template loaded from one known path has no use for. It declares an MSRV
# (1.70, under this workspace's 1.85), where tera declares none. And its `Error`'s plain
# `Display` is a syntax/undefined diagnosis on its own, with the template's variables only
# reachable through the alternate `{:#}` form -- which is what lets `Error::Template` name
# what is wrong without risking the invite body reaching a terminal (see `Meeting::notes`).
#
# Default features only. The `json` feature was considered for its `tojson` filter, which is
# what the default template would escape meeting values into YAML frontmatter with, and
# rejected: `tojson` is HTML-safe, so it renders "Design & Review" as "Design & Review".
# That is valid YAML and unreadable frontmatter, and meeting titles containing `&` are not an
# edge case. `meethook-session` registers its own `yaml` filter instead -- see
# `transcript::yaml_filter`. Pure Rust either way: no build script, no C, so `flake.nix` needs
# nothing.
minijinja = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
# Blocking and rustls-backed: one plain GET per model file wants neither an async runtime
# nor a native OpenSSL dependency in the flake.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# The classic (pre-1.0) rubato API. 1.0+ routes all I/O through the `audioadapter` traits,
# which buy nothing for one fixed-ratio mono conversion.
rubato = "0.16"

# Real-input FFT, for the GCC-PHAT delay estimate in meethook-transcribe::align. It wraps
# rustfft, which rubato already pulls in, so this adds a thin layer rather than a second FFT
# implementation -- and a real-input transform is half the work of pretending audio is
# complex.
realfft = "3.5"

# The Opus encoder behind `meeting.opus`, and the Ogg container it is wrapped in. Two crates
# because they are two concerns: Opus is a packet codec with no notion of a file, and Ogg is a
# framing format with no notion of audio. Keeping them separate is what the RFC 7845 mapping
# assumes, and it is why swapping either half later touches only one line here.
#
# ropus is the pure-Rust port of xiph's fixed-point reference, bit-exact against it, and it
# encodes as well as decodes -- verified by building against it rather than by reading the
# description: `Encoder::builder(rate, channels, Application)` with `encode_float`, plus
# `Signal::Voice`, VBR and complexity. That is the whole reason it is here instead of
# `audiopus`/`opus`, both of which are bindings to libopus and would put a C library in the
# flake for the sake of one artefact.
#
# Its `build.rs` does declare a `cc` build-dependency, and that is worth knowing rather than
# glossing over: the script compiles a small C driver that bakes xiph's neural weight tables
# into the *decoder*. It looks for those tables at `../reference/dnn/`, i.e. one level above
# the crate, which exists only in ropus's own git checkout. Consumed from the registry the
# path is absent, so the script takes its early-out branch, writes a zero-byte blob and
# invokes no compiler at all. Nothing here decodes in anger, so the disabled neural
# packet-loss concealment costs nothing either. `flake.nix` is unchanged by this dependency,
# which is the observable form of that claim.
#
# ropus declares `rust-version = "1.88"`, which is why this workspace's floor moved up to
# match. Six pure-Rust crates enter the graph in total: these two plus `wide`, `safe_arch`,
# `bytemuck` and `byteorder`.
ropus = "0.12"
ogg = "0.9"

# whisper.cpp bindings. `metal` pulls in `_gpu`, which is what makes `use_gpu` default to
# true; see the assertion in meethook-transcribe::asr that keeps that honest.
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

# ONNX Runtime bindings, for diarization and speaker embeddings.
#
# Pinned exactly, not with a caret. This is a pre-release whose surface has already moved
# under us once: `load-dynamic` and `ORT_DYLIB_PATH` -- which the original design for this
# slice was written against -- were deleted after rc.9. A caret requirement invites a
# routine `cargo update` to do that again.
#
# `pkg-config` is how the runtime is found: `ort-sys`'s build script probes for the module
# named `libonnxruntime` before anything else and returns immediately on a hit, so the
# flake's onnxruntime is what gets linked and nothing is downloaded. `download-binaries` is
# not a default feature, so a missed probe surfaces as a link error rather than as a
# silently different runtime.
#
# `api-27` is the ceiling, not an arbitrary choice: `ort-sys` rejects a probed library whose
# minor version is below the requested API level, and the flake's runtime is 1.27. Asking
# for `api-28` here would fail the probe and fall through to the download path.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
  "std",
  "coreml",
  "pkg-config",
  "api-27",
] }

# WebRTC AEC3, for the echo-cancellation pre-pass. The tilde requirement is what upstream
# recommends: the crate's major version tracks the PulseAudio-maintained APM major version,
# so a minor bump is allowed to break the API. `bundled` is deliberately off -- it would
# compile the vendored C++ here, which does not cross-compile on Apple
# (tonarino/webrtc-audio-processing#102); instead the sys crate probes pkg-config and links
# dynamically against the flake's `webrtc-audio-processing`.
webrtc-audio-processing = "~2.1"

# Apple framework bindings. Deliberately one binding family (objc2) for every framework
# this slice touches, so there is one `Retained<T>`, one `NSObject`, and no duplicate
# framework bindings in the tree. None of these have build scripts: they link via
# `#[link(kind = "framework")]`, which the flake's apple-sdk_26 already satisfies.
block2 = "0.6"
dispatch2 = "0.3"
# `exception` is for `objc2::exception::catch`. Apple's audio frameworks report some failures
# by raising an `NSException`, and one that unwinds into Rust aborts the process outright --
# see meethook-record::exception for what that cost. Deliberately not `catch-all`, which would
# wrap every `msg_send!` in the workspace in a `@try` to guard the handful of calls that can
# actually raise; the wrapping is done at those call sites instead, where it is visible.
objc2 = { version = "0.6", features = ["exception"] }
objc2-av-foundation = "0.3"
objc2-avf-audio = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
# EventKit, for naming a finished session after the meeting it was recorded during.
# `default-features = false` is load-bearing, not cosmetic: the default feature set pulls
# objc2-app-kit, objc2-core-location and objc2-map-kit, none of which are in this tree and
# one of which is enormous. With the list below the only crate this line adds to the build
# graph is objc2-event-kit itself -- objc2, objc2-foundation and block2 are already here.
#
# `EKSource` is here for the diagnostic in crates/meethook-record/examples/calendar-access.rs
# and for nothing in `src/`. It is what distinguishes "the work meetings are in an Exchange
# account synced into Calendar.app" from "there are accounts configured and none of them is
# the work one" -- `EKCalendar::type()` alone answers CalDAV/Exchange/Local but not *which*
# account, and this machine has three. Measured rather than assumed, by diffing
# `cargo tree -p meethook-record` and `Cargo.lock` across the change: it adds no crate and
# does not move the lock file. Its only effect beyond compiling `EKSource.rs` is turning on
# `objc2-foundation/NSSet` and `objc2-foundation/NSString`, and objc2-foundation is already
# in the tree with default features, so both were already on.
objc2-event-kit = { version = "0.3", default-features = false, features = [
  "EKCalendar",
  "EKCalendarItem",
  "EKEvent",
  "EKEventStore",
  "EKObject",
  "EKParticipant",
  "EKSource",
  "EKTypes",
  "block2",
  "std",
] }
objc2-foundation = "0.3"
# Only for `MTLCreateSystemDefaultDevice`, the pre-flight probe in meethook-transcribe::gpu.
# `default-features = false` is load-bearing: the default feature set is an enormous list
# covering all of Metal. `MTLDevice` alone is exactly what objc2-core-graphics already
# depends on -- same version, same single feature -- and that is already in the tree via
# meethook-record, so this line adds no crates and no extra compilation.
objc2-metal = { version = "0.3", default-features = false, features = ["MTLDevice"] }
objc2-screen-capture-kit = "0.3"
