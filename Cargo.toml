[workspace]
resolver = "3"
members = ["crates/meethook", "crates/meethook-session"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
meethook-session = { path = "crates/meethook-session" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
