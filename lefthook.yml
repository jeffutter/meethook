# Git hooks for meethook. Entering the devShell runs `lefthook install`, so a fresh
# clone is gated without a manual setup step.
#
# Every command here resolves `cargo`/`nextest`/`rustfmt`/`lefthook` from the devShell
# PATH. A
# commit made from a shell where direnv is not active fails with command-not-found
# rather than a lint error; that is accepted for this repo, which ships a committed
# .envrc.
#
# backlog/config.yml keeps bypassGitHooks: true on purpose. `backlog task edit` auto-
# commits task metadata on nearly every invocation, so running the Rust gates would add
# minutes of latency to each CLI call and would fail outright whenever the working tree
# is mid-edit. Those commits touch markdown only, so they have nothing for these gates
# to check.

pre-commit:
  # rustfmt has to succeed, and restage, before clippy is worth running at all.
  # `piped` only makes the commands sequential; lefthook still orders them by name
  # unless `priority` says otherwise, so every command below is numbered.
  piped: true
  commands:
    fmt:
      priority: 1
      glob: "*.rs"
      # Bare rustfmt, not `cargo fmt`: `cargo fmt` formats whole crates no matter which
      # paths it is handed, which would defeat pairing {staged_files} with stage_fixed.
      # It also means Cargo.toml is not read, so the edition is spelled out here and
      # must track `edition` in the workspace package table.
      run: rustfmt --edition 2024 {staged_files}
      stage_fixed: true
    clippy:
      priority: 2
      # The glob is what keeps a markdown- or nix-only commit from paying for a clippy
      # run. Note that clippy necessarily lints the working tree, not the staged
      # snapshot: a partially staged file is checked in full. Accepted.
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features --workspace -- -D warnings
    record-clippy:
      priority: 3
      # meethook-record is its own workspace (its Apple-framework dependencies cannot
      # compile off macOS, so it is excluded from the root one), which means the command
      # above never lints it. Lefthook has no platform filter, so the guard lives in the
      # script: off macOS it reports and exits clean rather than failing a commit.
      glob: "crates/meethook-record/**/*.rs"
      run: |
        [ "$(uname -s)" = "Darwin" ] || { echo "record-clippy skipped (not macOS)"; exit 0; }
        cd crates/meethook-record && cargo clippy --all-targets --workspace -- -D warnings

pre-push:
  # Cheapest gate first, and stop at the first failure, so a formatting slip does not
  # cost a full test-and-doc build. `priority` is what fixes that order: `piped` alone
  # would still run these by name, i.e. audit first and test last.
  piped: true
  commands:
    fmt:
      priority: 1
      run: cargo fmt --all --check
    clippy:
      priority: 2
      run: cargo clippy --all-targets --all-features --workspace -- -D warnings
    test:
      priority: 3
      # nextest, not cargo test: it runs each test binary in isolation, so one
      # panicking test cannot abort the rest of the suite, and the failure report
      # lists every failed test instead of stopping at the first.
      run: cargo nextest run --all-features --workspace
    doc:
      priority: 4
      env:
        RUSTDOCFLAGS: "-D warnings"
      run: cargo doc --no-deps --document-private-items --all-features --workspace
    record-crate:
      priority: 5
      # Same reason as `record-clippy`: the record crate sits outside this workspace, so
      # the gates above never touch it. On macOS its full gate runs here, keeping the
      # push-time promise that every Rust in the repo passed its own checks. Lefthook has
      # no platform filter, so the guard lives in the script.
      # The doc command mirrors the `doc` step above -- including RUSTDOCFLAGS spelled
      # inline, since this one script holds several commands and lefthook's `env` applies
      # per command rather than per line -- because the root workspace excludes this crate:
      # without it, a broken intra-doc link here fails no gate at all.
      run: |
        [ "$(uname -s)" = "Darwin" ] || { echo "record-crate skipped (not macOS)"; exit 0; }
        cd crates/meethook-record &&
        cargo fmt --all --check &&
        cargo clippy --all-targets --workspace -- -D warnings &&
        cargo nextest run --workspace &&
        RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items --workspace
    audit:
      priority: 6
      # Default DB location ($CARGO_HOME/advisory-db, fetched on each run) is deliberate.
      # It does not work from an agent sandbox -- $CARGO_HOME is read-only there and the
      # TLS interception breaks cargo-audit's fetch -- but a real `git push`, which is
      # what actually fires this hook, runs outside that sandbox, as does any human
      # shell. Pinning --db into ./target would not fix the sandbox case either (the
      # fetch still fails) and would cost a per-repo copy of the advisory DB.
      #
      # So this step is kept rather than dropped, and a sandboxed run that wants the
      # other four gates asks for that explicitly: LEFTHOOK_EXCLUDE=audit lefthook run
      # pre-push.
      run: cargo audit
    live-proof-notice:
      priority: 7
      # The hand-stop live proof (crates/meethook/tests/live_record_hand_stop.rs) cannot live in
      # the automatic gate above. It needs a real process capturing through the default input
      # device -- the recorder triggers on *which processes are capturing*, so no scripted capture
      # and no acoustic trick can stand in -- and it needs the launching terminal app to hold both
      # TCC grants, since macOS charges the grant to the responsible process that children inherit.
      # GitHub's macos-15 runner has neither, and this repo will not hack around that by editing
      # the system TCC database. So the case is `#[ignore]`d and the push gate only says how to run
      # it.
      #
      # `skip: - run:` is a condition for skipping, measured on lefthook 2.1.10 in both polarities.
      # The `uname` guard is not decorative: `os: [darwin]` does not filter ad-hoc `lefthook run`
      # invocations (an `os: [linux]` command was measured running on this Mac).
      skip:
        - run: test "${MEETHOOK_LIVE_PROOF:-0}" = "1"
      run: |
        [ "$(uname -s)" = "Darwin" ] || exit 0
        echo "live proof skipped: it needs a granted terminal and a microphone another process is capturing through."
        echo "  Run it with: MEETHOOK_LIVE_PROOF=1 git push   (or directly:"
        echo "    cargo build --manifest-path crates/meethook-record/Cargo.toml --example mic-hold"
        echo "    cargo nextest run -p meethook --run-ignored only -E 'binary(live_record_hand_stop)' --nocapture)"
    live-proof:
      priority: 7
      # The same job as a blocking gate, for the one shell that can satisfy it: a person pushing
      # from a terminal that holds the Microphone and Screen & System Audio Recording grants. The
      # switch is read from the pushing shell through `${MEETHOOK_LIVE_PROOF:-0}` rather than
      # supplied by lefthook's `env:`, because `env:` *provides* a value to the command instead of
      # reading one -- measured: a job with `env: MEETHOOK_LIVE_PROOF: 1` saw it set even with the
      # variable absent outside, which would make the gate fire on every push from anyone.
      skip:
        - run: test "${MEETHOOK_LIVE_PROOF:-0}" != "1"
      run: |
        [ "$(uname -s)" = "Darwin" ] || exit 0
        cargo build --manifest-path crates/meethook-record/Cargo.toml --example mic-hold &&
        cargo nextest run -p meethook --run-ignored only -E "binary(live_record_hand_stop)" --nocapture
