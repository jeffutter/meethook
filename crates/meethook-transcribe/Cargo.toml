[package]
name = "meethook-transcribe"
version = "0.1.0"
description = "Whisper ASR over a recorded meethook session's microphone track"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
meethook-models = { workspace = true }
meethook-session = { workspace = true }

hound = { workspace = true }
# For the session directories `import` builds: `create_session_dir` takes a `Zoned` and
# `SessionMetadata` a `Timestamp`. A normal dependency rather than a dev one since that path
# is compiled into the library.
jiff = { workspace = true }
# Solely for `MTLCreateSystemDefaultDevice`, the pre-flight device probe in `gpu`, without
# which whisper.cpp's Metal path segfaults instead of failing.
objc2-metal = { workspace = true }
# A normal dependency, not a dev one: the diarization and speaker-embedding graphs run on
# the real transcribe path.
ort = { workspace = true }
realfft = { workspace = true }
rubato = { workspace = true }
thiserror = { workspace = true }

# `metal` (not `coreml`): Metal alone is fast enough for batch, non-real-time use, and
# Core ML would need a one-time Python/coremltools conversion step this project exists to
# avoid. `default-features = false` is stated rather than implied -- whisper-rs's default
# feature set is empty today, and this keeps it that way if that ever changes.
whisper-rs = { workspace = true }

# AEC3 for the echo-cancellation pre-pass. A normal dependency, not a dev one: the pre-pass
# is on the real transcribe path, not just in tests.
webrtc-audio-processing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
