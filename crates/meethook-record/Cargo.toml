# Standalone workspace root, on purpose.
#
# This crate is pure Apple frameworks -- ScreenCaptureKit, Core Audio, EventKit -- and cannot
# compile off macOS. The root workspace therefore does not list it as a member: doing so would
# make every non-macOS `cargo build --workspace`, `clippy --all-targets` and `test` attempt to
# parse the objc2 tree and fail, which is exactly what keeps the transcribe half of the project
# from building on Linux. Declaring an (empty) `[workspace]` table makes this directory its own
# workspace root, so cargo treats it as an external path dependency when the `meethook` binary
# pulls it in (target-gated to macOS there) instead of as a sibling member.
#
# The costs, accepted rather than papered over:
#
# - Versions are literals here rather than `workspace = true` inheritance, because inheritance
#   only resolves inside the workspace that lists you as a member. The Apple-framework
#   crates and `mach2` are declared only here: the root workspace has no member that inherits
#   them, so a root entry would be dead. `jiff` and `libc` are shared with the root,
#   and must stay in step with its `[workspace.dependencies]` when bumping either side.
# - This directory carries its own `Cargo.lock`. Building from here resolves against it;
#   building the `meethook` binary from the root resolves against the root's lock file. Both
#   graphs contain the same crates at the same versions while the mirrors hold.
# - Gates run from this directory (`cargo fmt/clippy/test`), not from the root's `--workspace`.
#   lefthook.yml runs them on Darwin so a push is gated the same way as before.

[package]
name = "meethook-record"
version = "0.5.0"
description = "Dual-track (microphone + system audio) macOS capture into a meethook session directory"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"

# Rooting its own workspace (above) means the root's `cargo release` never reaches this
# manifest, so its version bump is a separate `cargo release` invocation against this
# directory -- scripts/release.sh runs it first. `tag = false` / `push = false` because the
# tag and push belong to the root's release: this crate's version-bump commit just needs to
# exist on `main` before the root runs, so it rides along in the root's push instead of
# racing it with a second one.
[package.metadata.release]
tag = false
push = false

[workspace]

[dependencies]
meethook-session = { path = "../meethook-session" }

jiff = "1"
libc = "0.2"
mach2 = "0.7"
thiserror = "2"

# Apple framework bindings. Deliberately one binding family (objc2) for every framework
# this slice touches, so there is one `Retained<T>`, one `NSObject`, and no duplicate
# framework bindings in the tree. None of these have build scripts: they link via
# `#[link(kind = "framework")]`, which the flake's apple-sdk_26 already satisfies.
block2 = "0.6"
dispatch2 = "0.3"
# `exception` is for `objc2::exception::catch`. Apple's audio frameworks report some failures
# by raising an `NSException`, and one that unwinds into Rust aborts the process outright --
# see meethook-record::exception for what that cost. Deliberately not `catch-all`, which would
# wrap every `msg_send!` in the workspace in a `@try` to guard the handful of calls that can
# actually raise; the wrapping is done at those call sites instead, where it is visible.
objc2 = { version = "0.6", features = ["exception"] }
objc2-av-foundation = "0.3"
objc2-avf-audio = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
# EventKit, for naming a finished session after the meeting it was recorded during.
# `default-features = false` is load-bearing, not cosmetic: the default feature set pulls
# objc2-app-kit, objc2-core-location and objc2-map-kit, none of which are in this tree and
# one of which is enormous. With the list below the only crate this line adds to the build
# graph is objc2-event-kit itself -- objc2, objc2-foundation and block2 are already here.
#
# `EKSource` is here for the diagnostic in crates/meethook-record/examples/calendar-access.rs
# and for nothing in `src/`. It is what distinguishes "the work meetings are in an Exchange
# account synced into Calendar.app" from "there are accounts configured and none of them is
# the work one" -- `EKCalendar::type()` alone answers CalDAV/Exchange/Local but not *which*
# account, and this machine has three. Measured rather than assumed, by diffing
# `cargo tree -p meethook-record` and `Cargo.lock` across the change: it adds no crate and
# does not move the lock file. Its only effect beyond compiling `EKSource.rs` is turning on
# `objc2-foundation/NSSet` and `objc2-foundation/NSString`, and objc2-foundation is already
# in the tree with default features, so both were already on.
objc2-event-kit = { version = "0.3", default-features = false, features = [
  "EKCalendar",
  "EKCalendarItem",
  "EKEvent",
  "EKEventStore",
  "EKObject",
  "EKParticipant",
  "EKSource",
  "EKTypes",
  "block2",
  "std",
] }
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"

[dev-dependencies]
# The decoder the tracks are read back with downstream; the tests read what the writer wrote.
rusty_flac = "=0.5.1"
serde_json = "1"
tempfile = "3"
