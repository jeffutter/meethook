[package]
name = "meethook-enroll"
version.workspace = true
description = "Correcting what an automatic pass got wrong -- the voices it could not name, the meeting it guessed at -- and rewriting the transcripts that said so"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
meethook-session = { workspace = true }

# For `identify_clusters` and `read_track_16k_mono` only. A heavy-looking dependency for a
# dot product and a resample, and still the right one: duplicating the matcher would
# duplicate its threshold too, and `enroll` and `transcribe` disagreeing about who counts as
# unresolved is exactly the drift the shared `unknown_labels` rule exists to prevent. The
# binary already links both crates, so nothing gets bigger.
meethook-transcribe = { workspace = true }

hound = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# `meeting` prints when a calendar event ran, in the machine's own zone, and takes the instant
# to look around from a session's start. Already in the graph through `meethook-session`, whose
# public types carry `Timestamp`; nothing new is compiled.
jiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
