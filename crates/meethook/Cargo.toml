[package]
name = "meethook"
version = "0.1.0"
description = "Local meeting recorder (macOS) and transcriber"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "meethook"
path = "src/main.rs"

[dependencies]
meethook-enroll = { workspace = true }
meethook-models = { workspace = true }
meethook-session = { workspace = true }
meethook-transcribe = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
jiff = { workspace = true }
ratatui = { workspace = true }
# The headless `--list` / `--dry-run` documents: versioned JSON on stdout for a scripted driver.
serde = { workspace = true }
serde_json = { workspace = true }
# For the scratch directory `enroll` extracts clips into: the player cannot seek, so playing
# part of a recording means writing that part out first.
tempfile = { workspace = true }

[dev-dependencies]
# The interrupt test drives the built binary through a real pty and kills it mid-commit.
libc = { workspace = true }

# The capture backend is pure Apple frameworks and cannot compile off macOS, so it is a
# target-gated dependency rather than an ordinary one: on non-macOS platforms the `record`
# subcommand and the calendar-backed halves of `meeting` simply do not exist, and nothing in
# this crate's build graph ever asks a non-Apple toolchain to parse the objc2 tree. The crate
# roots its own workspace; see crates/meethook-record/Cargo.toml for the rest of the story.
[target.'cfg(target_os = "macos")'.dependencies]
meethook-record = { path = "../meethook-record" }
