[package]
name = "meethook-session"
version.workspace = true
description = "The on-disk session-directory contract shared by every meethook subcommand"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# A session-contract crate depends on an audio library because it owns the *spelling* of the
# tracks it names, not only their file names: see `wav`, which corrects the channel mask hound
# hardcodes so a mono recording does not arrive in one ear.
hound = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
minijinja = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
